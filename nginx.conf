worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;

    # S3 objects can be arbitrarily large and are streamed, not buffered.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;

        # Railway's healthcheck dials the injected port, so readiness has to be
        # served here. This proxies Garage's own cluster health endpoint rather
        # than returning a static 200.
        location = /healthz {
            proxy_pass http://127.0.0.1:3902/health;
        }

        location / {
            proxy_pass http://127.0.0.1:3900;
            # SigV4 signs the Host header; pass the client's through untouched.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
